<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車輛抽檢系統</title>
  <style>
    body { font-family: '微軟正黑體', sans-serif; background-color: #f4f7f6; padding: 15px; font-size: 18px; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    h2 { color: #333; text-align: center; font-size: 26px; margin-bottom: 20px;}
    h3 { color: #333; text-align: center; font-size: 22px; margin-top: 30px;}
    .section { display: none; } 
    .section.active { display: block; } 
    
    .btn { display: block; width: 100%; padding: 18px; margin: 15px 0; font-size: 20px; font-weight: bold; color: white; background: #007bff; border: none; border-radius: 8px; cursor: pointer; text-align: center; }
    .btn:hover { background: #0056b3; }
    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #5a6268; }
    .btn:disabled { background: #cccccc; cursor: not-allowed; }

    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 18px; color: #444; }
    select, input[type="text"], input[type="password"] { width: 100%; padding: 15px; font-size: 18px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    
    .check-item { background: #f9f9f9; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #e0e0e0; }
    .check-item label { margin-bottom: 12px; font-size: 20px; color: #222; }
    .btn-group { display: flex; gap: 10px; width: 100%; }
    .status-btn { flex: 1; padding: 15px 5px; font-size: 18px; font-weight: bold; border: 2px solid #ccc; border-radius: 6px; background: #fff; color: #555; cursor: pointer; transition: 0.2s; }
    
    .status-btn.active-green { background: #28a745; color: white; border-color: #28a745; }
    .status-btn.active-red { background: #dc3545; color: white; border-color: #dc3545; }

    .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    .photo-item { border: 2px dashed #ccc; padding: 15px; text-align: center; border-radius: 8px; background: #fafafa; }
    .photo-item label { font-size: 18px; }
    .photo-item input { display: none; } 
    .photo-btn { background: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight:bold; margin-top: 10px; width: 100%;}
    .photo-status { display: block; margin-top: 8px; font-size: 14px; color: red; font-weight:bold; }

    canvas { border: 2px solid #ccc; width: 100%; height: 250px; background: #fff; cursor: crosshair; touch-action: none; border-radius: 8px; }
  </style>
</head>
<body>

<div class="container">
  <!-- 首頁入口 -->
  <div id="home-section" class="section active">
    <h2>🚚 車輛抽檢系統</h2>
    <p style="text-align:center; font-size: 20px;">請選擇您的身分進入系統</p>
    <button class="btn" onclick="showSection('driver-section')">我是駕駛 (填寫抽檢表)</button>
    <button class="btn btn-secondary" onclick="showSection('login-section')">我是幹部 (調閱與簽章)</button>
  </div>

  <!-- 幹部登入區 -->
  <div id="login-section" class="section">
    <h2>幹部登入</h2>
    <div class="form-group">
      <label>請輸入管理密碼：</label>
      <input type="password" id="admin-pwd" placeholder="請輸入密碼">
    </div>
    <button class="btn" onclick="verifyAdmin()">登入</button>
    <button class="btn btn-secondary" onclick="showSection('home-section')">返回首頁</button>
  </div>

  <!-- 幹部後台區 (新增審核清單與畫布) -->
  <div id="admin-dashboard" class="section">
    <h2>📋 幹部審核與簽章</h2>
    
    <div class="form-group">
      <label>待審核清單：</label>
      <select id="pendingList">
        <option value="">讀取中，請稍候...</option>
      </select>
    </div>
    <button class="btn btn-secondary" onclick="loadPendingList()" style="padding:12px; margin-bottom: 25px;">🔄 重新整理清單</button>

    <hr>
    <h3>✍️ 幹部核定簽名</h3>
    <canvas id="admin-signature-pad"></canvas>
    <button type="button" class="btn btn-secondary" onclick="clearAdminSignature()" style="padding: 12px; margin-top:10px;">清除重簽</button>
    
    <br><br>
    <button id="admin-submit-btn" class="btn" onclick="submitAdminSign()">✅ 送出核定簽章</button>
    <button class="btn btn-secondary" onclick="showSection('home-section')">登出返回</button>
  </div>

  <!-- 駕駛填表區 (隱藏) -->
  <div id="driver-section" class="section">
    <h2>📝 填寫車輛抽檢表</h2>
    
    <div class="form-group">
      <label>班別</label>
      <select id="shift">
        <option value="" disabled selected>請選擇班別</option>
        <option value="掃街班">掃街班</option>
        <option value="定點收運">定點收運</option>
        <option value="機動班">機動班</option>
        <option value="社區資收">社區資收</option>
        <option value="清運班">清運班</option>
        <option value="廚餘班">廚餘班</option>
      </select>
    </div>
    <div class="form-group">
      <label>車號</label>
      <input type="text" id="plateNumber" placeholder="例如：KEB-1234">
    </div>
    <div class="form-group">
      <label>檢查人員姓名</label>
      <input type="text" id="driverName" placeholder="請輸入您的姓名">
    </div>

    <hr>
    <h3>檢查項目</h3>
    <div class="check-item"><label>引擎機油</label><div class="btn-group"><button type="button" class="status-btn" onclick="selectStatus('engineOil', '標準', this)">標準</button><button type="button" class="status-btn" onclick="selectStatus('engineOil', '過多', this)">過多</button><button type="button" class="status-btn" onclick="selectStatus('engineOil', '不足', this)">不足</button></div><input type="hidden" id="check_engineOil" value=""></div>
    <div class="check-item"><label>方向機油</label><div class="btn-group"><button type="button" class="status-btn" onclick="selectStatus('steeringOil', '標準', this)">標準</button><button type="button" class="status-btn" onclick="selectStatus('steeringOil', '過多', this)">過多</button><button type="button" class="status-btn" onclick="selectStatus('steeringOil', '不足', this)">不足</button></div><input type="hidden" id="check_steeringOil" value=""></div>
    <div class="check-item"><label>油量</label><div class="btn-group"><button type="button" class="status-btn" onclick="selectStatus('fuel', '標準', this)">標準</button><button type="button" class="status-btn" onclick="selectStatus('fuel', '過多', this)">過多</button><button type="button" class="status-btn" onclick="selectStatus('fuel', '不足', this)">不足</button></div><input type="hidden" id="check_fuel" value=""></div>
    <div class="check-item"><label>煞車油</label><div class="btn-group"><button type="button" class="status-btn" onclick="selectStatus('brakeOil', '標準', this)">標準</button><button type="button" class="status-btn" onclick="selectStatus('brakeOil', '過多', this)">過多</button><button type="button" class="status-btn" onclick="selectStatus('brakeOil', '不足', this)">不足</button></div><input type="hidden" id="check_brakeOil" value=""></div>
    <div class="check-item"><label>水箱水</label><div class="btn-group"><button type="button" class="status-btn" onclick="selectStatus('coolant', '標準', this)">標準</button><button type="button" class="status-btn" onclick="selectStatus('coolant', '過多', this)">過多</button><button type="button" class="status-btn" onclick="selectStatus('coolant', '不足', this)">不足</button></div><input type="hidden" id="check_coolant" value=""></div>
    <div class="check-item"><label>電瓶水</label><div class="btn-group"><button type="button" class="status-btn" onclick="selectStatus('battery', '標準', this)">標準</button><button type="button" class="status-btn" onclick="selectStatus('battery', '過多', this)">過多</button><button type="button" class="status-btn" onclick="selectStatus('battery', '不足', this)">不足</button></div><input type="hidden" id="check_battery" value=""></div>

    <hr>
    <h3>📸 車況拍照紀錄 (請上傳 8 張)</h3>
    <div class="photo-grid" id="photoGrid"></div>

    <hr>
    <h3>✍️ 駕駛確認簽名</h3>
    <canvas id="signature-pad"></canvas>
    <button type="button" class="btn btn-secondary" onclick="clearSignature()" style="padding: 12px; margin-top:10px;">清除重簽</button>

    <br><br>
    <button id="submit-btn" class="btn" onclick="submitForm()">🚀 送出抽檢表</button>
    <button class="btn btn-secondary" onclick="showSection('home-section')">取消返回</button>
  </div>
</div>

<script>
  // ==========================================
  // 👉 請將下方引號內的網址，換成你的 Web App URL
  // ==========================================
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbw7_T9YdEdhJZtDqUyBuex56-rB8lBVhySmbqJNjDvMfVKVNJFPpdTln7zWg1vwK2uF/exec'; 

  function showSection(sectionId) {
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
    document.getElementById(sectionId).classList.add('active');
    
    if (sectionId === 'driver-section') {
      initSignaturePad();
      generatePhotoGrid();
    }
  }

  // --- 幹部相關邏輯 ---
  function verifyAdmin() {
    const pwd = document.getElementById('admin-pwd').value;
    if (pwd === '5555') {
      alert('登入成功！');
      showSection('admin-dashboard');
      document.getElementById('admin-pwd').value = '';
      initAdminSignaturePad();
      loadPendingList(); // 登入後自動讀取待審核清單
    } else {
      alert('密碼錯誤！');
    }
  }

  // 向 GAS 請求待審核清單
  function loadPendingList() {
    const select = document.getElementById('pendingList');
    select.innerHTML = '<option value="">讀取中，請稍候...</option>';
    
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'getPendingList' })
    })
    .then(res => res.json())
    .then(result => {
      if (result.status === 'success') {
        if (result.data.length === 0) {
          select.innerHTML = '<option value="" disabled selected>目前沒有待審核的單號 🎉</option>';
        } else {
          select.innerHTML = '<option value="" disabled selected>請選擇要審核的單號...</option>';
          result.data.forEach(item => {
            select.innerHTML += `<option value="${item.recordId}">車號 ${item.plate} (${item.time})</option>`;
          });
        }
      }
    })
    .catch(e => {
      select.innerHTML = '<option value="">讀取失敗，請檢查網路</option>';
    });
  }

  // 幹部送出簽名
  function submitAdminSign() {
    const recordId = document.getElementById('pendingList').value;
    if (!recordId) { alert('請先從下拉選單選擇一筆要審核的單號！'); return; }
    
    const signatureBase64 = adminCanvas.toDataURL('image/png');
    const payload = {
      action: 'updateCadreSign',
      recordId: recordId,
      signature: signatureBase64
    };

    const btn = document.getElementById('admin-submit-btn');
    btn.innerText = '簽章上傳中，請稍候...';
    btn.disabled = true;

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(result => {
      if (result.status === 'success') {
        alert('核定簽章已成功儲存！狀態已改為「已完成」。');
        clearAdminSignature();
        loadPendingList(); // 重新整理清單
        btn.innerText = '✅ 送出核定簽章';
        btn.disabled = false;
      } else {
        alert('錯誤：' + result.message);
        btn.innerText = '✅ 送出核定簽章';
        btn.disabled = false;
      }
    })
    .catch(e => {
      alert('連線失敗');
      btn.innerText = '✅ 送出核定簽章';
      btn.disabled = false;
    });
  }

  // --- 幹部簽名板繪圖邏輯 ---
  let adminCanvas, adminCtx, adminDrawing = false;
  function initAdminSignaturePad() {
    adminCanvas = document.getElementById('admin-signature-pad');
    adminCtx = adminCanvas.getContext('2d');
    const rect = adminCanvas.getBoundingClientRect();
    adminCanvas.width = rect.width;
    adminCanvas.height = rect.height;

    adminCanvas.addEventListener('mousedown', aStartPos);
    adminCanvas.addEventListener('mouseup', aEndPos);
    adminCanvas.addEventListener('mousemove', aDraw);
    adminCanvas.addEventListener('touchstart', aStartPos, {passive: false});
    adminCanvas.addEventListener('touchend', aEndPos);
    adminCanvas.addEventListener('touchmove', aDraw, {passive: false});
  }
  function aStartPos(e) { e.preventDefault(); adminDrawing = true; aDraw(e); }
  function aEndPos() { adminDrawing = false; adminCtx.beginPath(); }
  function aDraw(e) {
    if (!adminDrawing) return;
    e.preventDefault();
    const rect = adminCanvas.getBoundingClientRect();
    const x = (e.clientX || e.touches[0].clientX) - rect.left;
    const y = (e.clientY || e.touches[0].clientY) - rect.top;
    adminCtx.lineWidth = 4;
    adminCtx.lineCap = 'round';
    adminCtx.strokeStyle = '#000';
    adminCtx.lineTo(x, y);
    adminCtx.stroke();
    adminCtx.beginPath();
    adminCtx.moveTo(x, y);
  }
  function clearAdminSignature() { adminCtx.clearRect(0, 0, adminCanvas.width, adminCanvas.height); }

  // --- 駕駛填表相關邏輯 (與先前相同) ---
  function selectStatus(itemId, value, btnElement) {
    document.getElementById('check_' + itemId).value = value;
    const group = btnElement.parentElement;
    const buttons = group.querySelectorAll('.status-btn');
    buttons.forEach(btn => { btn.classList.remove('active-green', 'active-red'); });
    if (value === '標準') { btnElement.classList.add('active-green'); } else { btnElement.classList.add('active-red'); }
  }

  const photosData = {}; 
  function generatePhotoGrid() {
    const grid = document.getElementById('photoGrid');
    if (grid.innerHTML !== "") return; 
    for (let i = 1; i <= 8; i++) {
      const html = `
        <div class="photo-item">
          <label>照片 ${i}</label>
          <input type="file" id="file_${i}" accept="image/*" onchange="processImage(event, ${i})">
          <button type="button" class="photo-btn" onclick="document.getElementById('file_${i}').click()">📸 拍照 / 上傳</button>
          <span class="photo-status" id="status_${i}">尚未拍攝</span>
        </div>`;
      grid.innerHTML += html;
    }
  }

  function processImage(event, index) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const MAX_WIDTH = 800; 
        let width = img.width;
        let height = img.height;
        if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);
        photosData[`photo_${index}`] = canvas.toDataURL('image/jpeg', 0.7);
        const statusSpan = document.getElementById(`status_${index}`);
        statusSpan.innerText = "✅ 已上傳";
        statusSpan.style.color = "green";
      }
      img.src = e.target.result;
    }
    reader.readAsDataURL(file);
  }

  let canvas, ctx, drawing = false;
  function initSignaturePad() {
    canvas = document.getElementById('signature-pad');
    ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    canvas.addEventListener('mousedown', startPos);
    canvas.addEventListener('mouseup', endPos);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startPos, {passive: false});
    canvas.addEventListener('touchend', endPos);
    canvas.addEventListener('touchmove', draw, {passive: false});
  }
  function startPos(e) { e.preventDefault(); drawing = true; draw(e); }
  function endPos() { drawing = false; ctx.beginPath(); }
  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX || e.touches[0].clientX) - rect.left;
    const y = (e.clientY || e.touches[0].clientY) - rect.top;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000';
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }
  function clearSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

  function submitForm() {
    const shift = document.getElementById('shift').value;
    const driverName = document.getElementById('driverName').value;
    const plateNumber = document.getElementById('plateNumber').value;
    if (!shift || !driverName || !plateNumber) { alert("請填寫班別、姓名與車號！"); return; }
    
    const itemKeys = ['engineOil', 'steeringOil', 'fuel', 'brakeOil', 'coolant', 'battery'];
    const inspectionItems = {};
    for (let key of itemKeys) {
      const val = document.getElementById('check_' + key).value;
      if (!val) { alert("請完成所有油水檢查項目的點選！"); return; }
      inspectionItems[key] = val;
    }

    if (Object.keys(photosData).length < 8) { alert("請確認 8 張照片皆已上傳完畢！"); return; }

    const signatureBase64 = canvas.toDataURL('image/png');
    const payload = {
      action: 'submitInspection',
      timestamp: new Date().toLocaleString('zh-TW', {hour12: false}), 
      driverName: driverName,
      plateNumber: plateNumber,
      shift: shift,
      items: inspectionItems,
      photos: photosData,
      signature: signatureBase64
    };

    const submitBtn = document.getElementById('submit-btn');
    submitBtn.innerText = '資料上傳中，請稍候...';
    submitBtn.disabled = true;

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(result => {
      if(result.status === 'success') {
        alert('抽檢表上傳成功！單號：' + result.recordId);
        window.location.reload(); 
      } else {
        alert('發生錯誤：' + result.message);
        submitBtn.innerText = '🚀 送出抽檢表';
        submitBtn.disabled = false;
      }
    })
    .catch(error => {
      alert('網路連線失敗，請檢查網址或網路狀態。');
      submitBtn.innerText = '🚀 送出抽檢表';
      submitBtn.disabled = false;
    });
  }
</script>
</body>
</html>
