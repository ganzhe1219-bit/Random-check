<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>車輛抽檢系統</title>
  <style>
    body { font-family: '微軟正黑體', sans-serif; background-color: #f4f7f6; padding: 15px; font-size: 18px; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); position: relative;}
    h2 { color: #333; text-align: center; font-size: 26px; margin-bottom: 20px;}
    h3 { color: #333; text-align: center; font-size: 22px; margin-top: 30px;}
    .section { display: none; } 
    .section.active { display: block; } 
    
    .btn { display: block; width: 100%; padding: 18px; margin: 15px 0; font-size: 20px; font-weight: bold; color: white; background: #007bff; border: none; border-radius: 8px; cursor: pointer; text-align: center; }
    .btn:hover { background: #0056b3; }
    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #5a6268; }
    .btn:disabled { background: #cccccc; cursor: not-allowed; }

    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 18px; color: #444; }
    select, input[type="text"], input[type="password"] { width: 100%; padding: 15px; font-size: 18px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .num-btn { padding: 20px; font-size: 24px; font-weight: bold; background: #e9ecef; border: 2px solid #ced4da; border-radius: 8px; cursor: pointer; color: #333; touch-action: manipulation; }
    .num-btn:active { background: #d3d9df; }
    .num-btn-del { background: #ffc107; border-color: #ffc107; color: #000; }
    #pwd-display { text-align: center; font-size: 32px; letter-spacing: 10px; margin: 20px 0; min-height: 40px; border-bottom: 2px dashed #ccc; padding-bottom: 10px;}

    .check-item { background: #f9f9f9; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #e0e0e0; }
    .check-item label { margin-bottom: 12px; font-size: 20px; color: #222; }
    .btn-group { display: flex; gap: 6px; width: 100%; }
    .status-btn { flex: 1; padding: 15px 2px; font-size: 16px; font-weight: bold; border: 2px solid #ccc; border-radius: 6px; background: #fff; color: #555; cursor: pointer; transition: 0.2s; }
    .status-btn.active-green { background: #28a745; color: white; border-color: #28a745; }
    .status-btn.active-red { background: #dc3545; color: white; border-color: #dc3545; }
    .status-btn.active-gray { background: #6c757d; color: white; border-color: #6c757d; }

    .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    .photo-item { border: 2px dashed #ccc; padding: 15px; text-align: center; border-radius: 8px; background: #fafafa; }
    .photo-item label { font-size: 18px; }
    .photo-item input { display: none; } 
    .photo-actions { display: flex; gap: 8px; margin-top: 10px; }
    .photo-btn-cam { background: #28a745; color: white; padding: 10px 5px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight:bold; flex: 1; }
    .photo-btn-up { background: #17a2b8; color: white; padding: 10px 5px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight:bold; flex: 1; }
    .photo-status { display: block; margin-top: 8px; font-size: 14px; color: red; font-weight:bold; }

    canvas { border: 2px solid #ccc; width: 100%; height: 250px; background: #fff; cursor: crosshair; touch-action: none; border-radius: 8px; }

    #successModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 40px; border-radius: 12px; text-align: center; width: 85%; max-width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .modal-content h1 { color: #28a745; font-size: 36px; margin: 0 0 15px 0; }
    .modal-content p { font-size: 20px; color: #333; margin-bottom: 30px; line-height: 1.6; white-space: pre-wrap;}
    .modal-btn { background: #28a745; color: white; border: none; padding: 18px; width: 100%; font-size: 24px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .modal-btn:hover { background: #218838; }

    #inspection-info { display: none; background: #e9ecef; padding: 15px; border-radius: 8px; border: 2px solid #ced4da; margin-bottom: 20px; }
    #inspection-info h4 { margin-top: 0; text-align: center; color: #333; font-size: 20px; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; font-size: 18px; }
    .info-label { color: #555; }
    .info-value { font-weight: bold; }
  </style>
</head>
<body>

<script>
  // ==========================================
  // 👉 請將下方引號內的網址，換成你的 Web App URL
  // ==========================================
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbw7_T9YdEdhJZtDqUyBuex56-rB8lBVhySmbqJNjDvMfVKVNJFPpdTln7zWg1vwK2uF/exec'; 

  let currentPendingData = [];

  function showSection(sectionId) {
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
    document.getElementById(sectionId).classList.add('active');
    if (sectionId === 'driver-section') {
      initSignaturePad();
      generatePhotoGrid();
    }
  }

  function showSuccessModal(message) {
    document.getElementById('modalMessage').innerText = message;
    document.getElementById('successModal').style.display = 'flex';
  }
  function closeModalAndReload() {
    window.location.reload();
  }

  function inputPwd(num) {
    const pwdInput = document.getElementById('admin-pwd');
    if(pwdInput.value.length < 8) { pwdInput.value += num; updatePwdDisplay(); }
  }
  function delPwd() {
    const pwdInput = document.getElementById('admin-pwd');
    pwdInput.value = pwdInput.value.slice(0, -1);
    updatePwdDisplay();
  }
  function updatePwdDisplay() {
    const pwd = document.getElementById('admin-pwd').value;
    document.getElementById('pwd-display').innerText = '*'.repeat(pwd.length);
  }

  function verifyAdmin() {
    const pwd = document.getElementById('admin-pwd').value;
    if (pwd === '5555') {
      showSection('admin-dashboard');
      document.getElementById('admin-pwd').value = '';
      updatePwdDisplay();
      loadPendingList(); 
    } else {
      alert('密碼錯誤！');
      document.getElementById('admin-pwd').value = '';
      updatePwdDisplay();
    }
  }

  function loadPendingList() {
    const select = document.getElementById('pendingList');
    const infoBox = document.getElementById('inspection-info');
    infoBox.style.display = 'none'; 
    select.innerHTML = '<option value="">讀取中，請稍候...</option>';
    
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'getPendingList' })
    })
    .then(res => res.json())
    .then(result => {
      if (result.status === 'success') {
        currentPendingData = result.data; 
        if (result.data.length === 0) {
          select.innerHTML = '<option value="" disabled selected>目前沒有待審核的紀錄 🎉</option>';
        } else {
          select.innerHTML = '<option value="" disabled selected>請選擇要審核的車輛...</option>';
          result.data.forEach(item => {
            select.innerHTML += `<option value="${item.recordId}">${item.time} ｜ 車號: ${item.plate} ｜ ${item.inspector}</option>`;
          });
        }
      }
    })
    .catch(e => {
      select.innerHTML = '<option value="">讀取失敗，請檢查網路</option>';
    });
  }

  function showInspectionInfo() {
    const selectedId = document.getElementById('pendingList').value;
    const infoBox = document.getElementById('inspection-info');
    if (!selectedId) { infoBox.style.display = 'none'; return; }

    const record = currentPendingData.find(item => item.recordId === selectedId);
    if (record && record.items) {
      const fields = ['engineOil', 'steeringOil', 'fuel', 'brakeOil', 'coolant', 'battery'];
      fields.forEach(f => {
        const el = document.getElementById('info-' + f);
        const val = record.items[f] || '無資料';
        el.innerText = val;
        if (val === '標準') {
          el.style.color = '#28a745'; // 綠字
        } else if (val === '無此項' || val === '無資料') {
          el.style.color = '#6c757d'; // 灰字 (不亮紅字)
        } else {
          el.style.color = '#dc3545'; // 紅字 (過多/不足)
        }
      });
      infoBox.style.display = 'block'; 
    }
  }

  function submitAdminSign() {
    const recordId = document.getElementById('pendingList').value;
    if (!recordId) { alert('請先從下拉選單選擇一筆要審核的紀錄！'); return; }
    
    const stampCanvas = document.createElement('canvas');
    stampCanvas.width = 400;
    stampCanvas.height = 200;
    const ctx = stampCanvas.getContext('2d');

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, stampCanvas.width, stampCanvas.height);
    ctx.strokeStyle = "#cc0000";
    ctx.lineWidth = 6;
    ctx.strokeRect(10, 10, stampCanvas.width - 20, stampCanvas.height - 20);
    ctx.fillStyle = "#cc0000";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 48px '微軟正黑體', sans-serif";
    ctx.fillText("隊長 韓宗翰", stampCanvas.width / 2, 70);
    ctx.font = "24px '微軟正黑體', sans-serif";
    const now = new Date();
    const timeStr = now.toLocaleString('zh-TW', { hour12: false });
    ctx.fillText(timeStr, stampCanvas.width / 2, 140);

    const signatureBase64 = stampCanvas.toDataURL('image/png');
    const payload = { action: 'updateCadreSign', recordId: recordId, signature: signatureBase64 };

    const btn = document.getElementById('admin-submit-btn');
    btn.innerText = '蓋章上傳中，請稍候...';
    btn.disabled = true;

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(result => {
      if (result.status === 'success') {
        showSuccessModal('主管電子核章已成功蓋上！');
      } else {
        alert('錯誤：' + result.message);
        btn.innerText = '✅ 一鍵核准 (自動蓋章)';
        btn.disabled = false;
      }
    })
    .catch(e => {
      alert('連線失敗');
      btn.innerText = '✅ 一鍵核准 (自動蓋章)';
      btn.disabled = false;
    });
  }

 function selectStatus(itemId, value, btnElement) {
    document.getElementById('check_' + itemId).value = value;
    const group = btnElement.parentElement;
    const buttons = group.querySelectorAll('.status-btn');
    buttons.forEach(btn => { btn.classList.remove('active-green', 'active-red', 'active-gray'); });
    
    if (value === '標準') {
      btnElement.classList.add('active-green');
    } else if (value === '無此項') {
      btnElement.classList.add('active-gray');
    } else {
      btnElement.classList.add('active-red');
    }
  }

  const photosData = {}; 

  function generatePhotoGrid() {
    const grid = document.getElementById('photoGrid');
    if (grid.innerHTML !== "") return; 
    for (let i = 1; i <= 6; i++) { // 👉 修改：改為產生 6 個上傳框
      const html = `
        <div class="photo-item">
          <label>照片 ${i}</label>
          <input type="file" id="file_cam_${i}" accept="image/*" capture="environment" onchange="processImage(event, ${i}, true)">
          <input type="file" id="file_up_${i}" accept="image/*" onchange="processImage(event, ${i}, false)">
          <div class="photo-actions">
            <button type="button" class="photo-btn-cam" onclick="document.getElementById('file_cam_${i}').click()">📸 拍照</button>
            <button type="button" class="photo-btn-up" onclick="document.getElementById('file_up_${i}').click()">📁 相簿</button>
          </div>
          <span class="photo-status" id="status_${i}">尚未完成</span>
        </div>`;
      grid.innerHTML += html;
    }
  }

  function processImage(event, index, isCamera) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const MAX_WIDTH = 800; 
        let width = img.width;
        let height = img.height;
        if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);

        if (isCamera) {
          const now = new Date();
          const timeStr = now.toLocaleString('zh-TW', { hour12: false });
          ctx.font = "bold 32px sans-serif";
          ctx.fillStyle = "#FFD700";
          ctx.strokeStyle = "black";
          ctx.lineWidth = 4;
          ctx.textAlign = "right";
          ctx.textBaseline = "bottom";
          const padding = 15;
          ctx.strokeText(timeStr, width - padding, height - padding);
          ctx.fillText(timeStr, width - padding, height - padding);
        }

        photosData[`photo_${index}`] = canvas.toDataURL('image/jpeg', 0.7);
        const statusSpan = document.getElementById(`status_${index}`);
        statusSpan.innerText = "✅ 已完成";
        statusSpan.style.color = "green";
      }
      img.src = e.target.result;
    }
    reader.readAsDataURL(file);
  }

  let canvas, ctx, drawing = false;
  function initSignaturePad() {
    canvas = document.getElementById('signature-pad');
    ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    canvas.addEventListener('mousedown', startPos);
    canvas.addEventListener('mouseup', endPos);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startPos, {passive: false});
    canvas.addEventListener('touchend', endPos);
    canvas.addEventListener('touchmove', draw, {passive: false});
  }
  function startPos(e) { e.preventDefault(); drawing = true; draw(e); }
  function endPos() { drawing = false; ctx.beginPath(); }
  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX || e.touches[0].clientX) - rect.left;
    const y = (e.clientY || e.touches[0].clientY) - rect.top;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000';
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }
  function clearSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

  function submitForm() {
    const shift = document.getElementById('shift').value;
    const driverName = document.getElementById('driverName').value;
    const plateNumber = document.getElementById('plateNumber').value;
    if (!shift || !driverName || !plateNumber) { alert("請填寫班別、姓名與車號！"); return; }
    
    const itemKeys = ['engineOil', 'steeringOil', 'fuel', 'brakeOil', 'coolant', 'battery'];
    const inspectionItems = {};
    for (let key of itemKeys) {
      const val = document.getElementById('check_' + key).value;
      if (!val) { alert("請完成所有油水檢查項目的點選！"); return; }
      inspectionItems[key] = val;
    }

    // 👉 修改：檢查是否已上傳 6 張照片
    if (Object.keys(photosData).length < 6) { alert("請確認 6 張照片皆已上傳完畢！"); return; }

    const signatureBase64 = canvas.toDataURL('image/png');
    const payload = {
      action: 'submitInspection',
      timestamp: new Date().toLocaleString('zh-TW', {hour12: false}), 
      driverName: driverName,
      plateNumber: plateNumber,
      shift: shift,
      items: inspectionItems,
      photos: photosData,
      signature: signatureBase64
    };

    const submitBtn = document.getElementById('submit-btn');
    submitBtn.innerText = '資料上傳中，請稍候...';
    submitBtn.disabled = true;

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(result => {
      if(result.status === 'success') {
        showSuccessModal(`抽檢表上傳成功！\n車號：${plateNumber}`);
      } else {
        alert('發生錯誤：' + result.message);
        submitBtn.innerText = '🚀 送出抽檢表';
        submitBtn.disabled = false;
      }
    })
    .catch(error => {
      alert('網路連線失敗，請檢查網址或網路狀態。');
      submitBtn.innerText = '🚀 送出抽檢表';
      submitBtn.disabled = false;
    });
  }
